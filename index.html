<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef1e9">
  <title>Астана — сценарий развития</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <main class="workspace" id="planningView">
      <aside class="catalog panel">
        <div class="panel-heading"><h1>Мероприятия</h1><span class="subtle-count">14</span></div>
        <div class="catalog-tools">
          <label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="searchInput" type="search" placeholder="Поиск" aria-label="Поиск мероприятия"></label>
          <div class="filter-row" id="filterRow" aria-label="Направления">
            <button class="filter-chip active" data-filter="Все" type="button">Все</button>
            <button class="filter-chip" data-filter="Транспорт" type="button">Транспорт</button>
            <button class="filter-chip" data-filter="Экология" type="button">Экология</button>
            <button class="filter-chip" data-filter="Соцсфера" type="button">Соцсфера</button>
            <button class="filter-chip" data-filter="Безопасность" type="button">Безопасность</button>
            <button class="filter-chip" data-filter="Сервисы" type="button">Сервисы</button>
          </div>
        </div>
        <div class="catalog-list" id="catalogList"></div>
      </aside>

      <section class="map-region" id="mapCard" aria-label="Карта районов Астаны">
        <div class="map-place"><strong>Астана</strong><span id="mapScope">5 районов</span></div>
        <div class="map-stage" id="mapStage">
          <svg id="cityMap" class="city-map" viewBox="0 0 900 700" role="group" aria-label="Изометрическая карта районов Астаны"><g id="mapCamera"></g></svg>
        </div>
        <div class="map-toolbar"><button id="resetMapButton" class="map-reset" type="button" aria-label="Показать весь город" title="Показать весь город"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/></svg></button><span>8 кварталов</span></div>
        <button class="city-drop" id="cityDrop" data-city-drop="true" type="button"><span>＋</span> Весь город</button>
        <div class="map-compass" aria-hidden="true"><span>С</span><svg viewBox="0 0 24 38"><path d="M12 2 21 30 12 24 3 30Z"/><path d="M12 2V24"/></svg></div>
        <div class="drop-preview hidden" id="dropPreview" aria-live="polite"></div>
      </section>

      <div class="right-rail">
        <div class="pulse-space">
          <section class="pulse" id="pulse" aria-label="Пульс города">
            <button id="orbButton" class="orb-button" type="button" aria-label="Открыть показатели" aria-expanded="false" aria-controls="indicatorPanel"><span class="orb-color"></span><span class="orb-close">×</span></button>
            <div class="pulse-content" id="pulseContent" inert>
              <div class="pulse-head"><span id="orbScope">Астана</span><strong id="orbScore">52.56</strong><small id="orbChange">из 100</small></div>
              <div class="indicator-panel" id="indicatorPanel"></div>
            </div>
          </section>
        </div>
        <aside class="plan panel">
          <div class="plan-top"><h2>Сценарий<span class="count-pill" id="decisionCount">0 / 5</span></h2></div>
          <div class="budget-block"><div class="budget-line"><span>Бюджет</span><strong><span id="spentValue">0</span><small> / 100</small></strong></div><div class="budget-track"><span id="budgetFill"></span></div><div class="budget-left"><span>Доступно</span><strong id="remainingValue">100 ед.</strong></div></div>
          <div class="decision-list" id="decisionList"></div>
          <div class="plan-bottom"><div class="status-message" id="statusMessage" aria-live="polite"></div><button class="calculate-button" id="calculateButton" type="button" disabled><span>Рассчитать</span><span>↗</span></button></div>
        </aside>
      </div>
    </main>

    <main class="report-view hidden" id="reportView">
      <div class="report-head"><button id="backButton" class="back-button" type="button">← К карте</button><button id="restartButton" class="text-button" type="button">Новый сценарий ↗</button></div>
      <div class="report-hero"><div><span class="report-kicker">Через 8 кварталов</span><h1>Результат сценария</h1></div><div class="report-score"><span>Качество жизни</span><strong id="reportScore">—</strong><small id="reportDelta">—</small><div>Сейчас <b>52.56</b></div></div></div>
      <div class="report-tabs" id="reportTabs"></div>
      <div class="report-mode" id="reportMode"><button type="button" data-mode="metrics" class="active">Показатели</button><button type="button" data-mode="analysis">Выводы</button></div><div id="reportContent" class="report-content" data-mode="metrics"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
