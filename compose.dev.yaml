services:
  ui:
    volumes:
      - ./server.js:/app/server.js:ro
      - ./package.json:/app/package.json:ro
      - ./index.html:/app/index.html:ro
      - ./styles.css:/app/styles.css:ro
      - ./app.js:/app/app.js:ro
      - ./api.js:/app/api.js:ro
      - ./model.js:/app/model.js:ro
      - ./i18n.js:/app/i18n.js:ro
      - ./locales.js:/app/locales.js:ro
      - ./map-geometry.js:/app/map-geometry.js:ro
      - ./map-objects.js:/app/map-objects.js:ro
      - ./map-object-art.js:/app/map-object-art.js:ro
      - ./svg:/app/svg:ro
    command: ["node", "--watch", "server.js"]

  api:
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app/backend:ro
      - ./shared:/app/shared:ro
      - ./data/tech2-v1:/app/data/tech2-v1:ro
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
