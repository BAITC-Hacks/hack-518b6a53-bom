<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef1e9">
  <title>Астана — сценарий развития</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <div class="startup-status" id="startupStatus" role="status"><p id="startupMessage"></p><button type="button" id="retryCatalog" class="retry-button hidden" data-i18n="network.retry">Повторить</button></div>
    <main class="workspace" id="planningView">
      <div class="language-switcher map-language" role="group" aria-label="Язык интерфейса" data-i18n-aria="ui.language">
        <button type="button" data-language="ru" lang="ru" title="Русский" aria-label="Русский" aria-pressed="true">RU</button>
        <button type="button" data-language="kk" lang="kk" title="Қазақша" aria-label="Қазақша" aria-pressed="false">ҚАЗ</button>
        <button type="button" data-language="en" lang="en" title="English" aria-label="English" aria-pressed="false">EN</button>
      </div>
      <aside class="catalog panel">
        <div class="panel-heading"><h1 data-i18n="ui.measures">Мероприятия</h1><span class="subtle-count">14</span></div>
        <div class="catalog-tools">
          <div class="filter-row" id="filterRow" aria-label="Направления" data-i18n-aria="ui.categories">
            <button class="filter-chip active" data-filter="Все" type="button" aria-label="Все" data-i18n-aria="groups.all" aria-pressed="true" title="Все мероприятия" data-i18n-title="ui.allMeasures"><img src="./svg/all.svg" width="32" height="32" alt=""><span data-i18n="groups.all">Все</span></button>
            <button class="filter-chip" data-filter="Транспорт" type="button" aria-label="Транспорт" data-i18n-aria="groups.transport" aria-pressed="false" title="Транспорт" data-i18n-title="groups.transport"><img src="./svg/transport.svg" width="32" height="32" alt=""><span data-i18n="groups.transport">Транспорт</span></button>
            <button class="filter-chip" data-filter="Экология" type="button" aria-label="Экология" data-i18n-aria="groups.ecology" aria-pressed="false" title="Экология" data-i18n-title="groups.ecology"><img src="./svg/ecology.svg" width="32" height="32" alt=""><span data-i18n="groups.ecology">Экология</span></button>
            <button class="filter-chip" data-filter="Соцсфера" type="button" aria-label="Соцсфера" data-i18n-aria="groups.social" aria-pressed="false" title="Соцсфера" data-i18n-title="groups.social"><img src="./svg/social.svg" width="32" height="32" alt=""><span data-i18n="groups.social">Соцсфера</span></button>
            <button class="filter-chip" data-filter="Безопасность" type="button" aria-label="Безопасность" data-i18n-aria="groups.security" aria-pressed="false" title="Безопасность" data-i18n-title="groups.security"><img src="./svg/security.svg" width="32" height="32" alt=""><span data-i18n="groups.security">Безопасность</span></button>
            <button class="filter-chip" data-filter="Сервисы" type="button" aria-label="Сервисы" data-i18n-aria="groups.services" aria-pressed="false" title="Сервисы" data-i18n-title="groups.services"><img src="./svg/services.svg" width="32" height="32" alt=""><span data-i18n="groups.services">Сервисы</span></button>
          </div>
        </div>
        <div class="catalog-list" id="catalogList"></div>
      </aside>

      <section class="map-region" id="mapCard" aria-label="Карта районов Астаны" data-i18n-aria="ui.mapLabel">
        <div class="map-place"><strong data-i18n="ui.cityName">Астана</strong><span id="mapScope">5 районов</span></div>
        <div class="map-stage" id="mapStage">
          <svg id="cityMap" class="city-map" viewBox="80 90 700 500" role="group" aria-label="Изометрическая карта районов Астаны" data-i18n-aria="ui.mapIsometric"><g id="mapCamera"></g></svg>
        </div>
        <div class="drop-preview hidden" id="dropPreview" aria-live="polite"></div>
      </section>

      <div class="right-rail">
        <div class="pulse-space">
          <section class="pulse" id="pulse" aria-label="Пульс города" data-i18n-aria="ui.cityPulse">
            <button id="orbButton" class="orb-button" type="button" aria-label="Открыть показатели" aria-expanded="false" aria-controls="indicatorPanel"><span class="orb-color"></span><span class="orb-close">×</span></button>
            <div class="pulse-content" id="pulseContent" inert>
              <div class="pulse-head"><span id="orbScope">Астана</span><strong id="orbScore">—</strong><small id="orbChange">из 100</small></div>
              <div class="indicator-panel" id="indicatorPanel"></div>
            </div>
          </section>
        </div>
        <aside class="plan panel">
          <div class="plan-top"><h2><span data-i18n="ui.scenario">Сценарий</span><span class="count-pill" id="decisionCount">0 / 5</span></h2></div>
          <div class="budget-block"><div class="budget-line"><span data-i18n="ui.budget">Бюджет</span><strong><span id="spentValue">0</span><small id="budgetLimit"> / 100</small></strong></div><div class="budget-track"><span id="budgetFill"></span></div><div class="budget-left"><span data-i18n="ui.available">Доступно</span><strong id="remainingValue">100 ед.</strong></div></div>
          <div class="decision-list" id="decisionList"></div>
          <div class="plan-bottom"><div class="status-message" id="statusMessage" aria-live="polite"></div><button type="button" class="retry-button hidden" id="retryValidation" data-i18n="network.retry">Повторить</button><button class="calculate-button" id="calculateButton" type="button" disabled><span data-i18n="ui.calculate">Рассчитать</span></button></div>
        </aside>
      </div>
    </main>

    <main class="report-view hidden" id="reportView">
      <div class="report-head">
        <button id="backButton" class="back-button" type="button" data-i18n="ui.backToMap">К карте</button>
        <div class="language-switcher" role="group" aria-label="Язык интерфейса" data-i18n-aria="ui.language">
          <button type="button" data-language="ru" lang="ru" title="Русский" aria-label="Русский" aria-pressed="true">RU</button>
          <button type="button" data-language="kk" lang="kk" title="Қазақша" aria-label="Қазақша" aria-pressed="false">ҚАЗ</button>
          <button type="button" data-language="en" lang="en" title="English" aria-label="English" aria-pressed="false">EN</button>
        </div>
        <button id="restartButton" class="text-button" type="button" data-i18n="ui.newScenario">Новый сценарий</button>
      </div>
      <div class="report-hero"><div><span class="report-kicker" data-i18n="ui.afterHorizon">Через 8 кварталов</span><h1 data-i18n="ui.resultTitle">Результат сценария</h1></div><div class="report-score"><span data-i18n="ui.qualityOfLife">Качество жизни</span><strong id="reportScore">—</strong><small id="reportDelta">—</small><div><span data-i18n="ui.now">Сейчас</span> <b id="reportBaseline">52.56</b></div></div></div>
      <div class="report-tabs" id="reportTabs"></div>
      <div class="report-mode" id="reportMode"><button type="button" data-mode="metrics" class="active" data-i18n="ui.metrics">Показатели</button><button type="button" data-mode="analysis" data-i18n="ui.analysis">Выводы</button></div><div id="reportContent" class="report-content" data-mode="metrics"></div>
    </main>
  </div>
  <dialog class="object-dialog" id="objectDialog" aria-labelledby="objectTitle">
    <div class="object-dialog-toolbar"><button class="object-close" id="closeObjectButton" type="button" aria-label="Закрыть карточку" data-i18n-aria="objects.close" autofocus>×</button></div>
    <div id="objectDetails"></div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
